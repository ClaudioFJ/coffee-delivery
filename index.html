<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coffee Delivery: escolha seu café e receba onde estiver." />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica a cor de fundo do tema ANTES do React carregar, evitando o
      // "flash" branco ao abrir a página no tema escuro. Mesma regra do AppThemeProvider.
      try {
        var saved = JSON.parse(localStorage.getItem('coffee-delivery:theme:v1'))
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.style.backgroundColor = dark ? '#161312' : '#FAFAFA'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <!-- Pré-carrega a maior imagem da primeira tela antes do JavaScript (melhora o LCP) -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-cup-952.webp"
      imagesrcset="/images/hero-cup-600.webp 600w, /images/hero-cup-952.webp 952w"
      imagesizes="(min-width: 1024px) 476px, (min-width: 480px) 352px, 100vw"
      fetchpriority="high"
    />
    <title>Coffee Delivery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
